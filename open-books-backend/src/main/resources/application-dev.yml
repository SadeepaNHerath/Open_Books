spring:
  datasource:
    url: ${OPENBOOKS_DB_URL:jdbc:mysql://localhost:3306/open_books?createDatabaseIfNotExist=true}
    username: ${OPENBOOKS_DB_USERNAME:root}
    password: ${OPENBOOKS_DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    database: mysql
    database-platform: org.hibernate.dialect.MySQLDialect
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${OPENBOOKS_MAIL_USERNAME:}
    password: ${OPENBOOKS_MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.starttls.required: true
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 3000
      mail.smtp.writetimeout: 5000
application:
  security:
    jwt:
      secret-key: FcLI2MTMO1FDbLQORWTvMlGVoNRJQ0FfNdOrP+njE9Y=
      expiration: 8640000
  mailing:
    enabled: ${OPENBOOKS_MAIL_ENABLED:true}
    from: ${OPENBOOKS_MAIL_FROM:${OPENBOOKS_MAIL_USERNAME:}}
    frontend:
      activation-url: http://localhost:4200/activate-account
  file:
    uploads:
      photos-output-path: ./uploads
server:
  port: 8088
  max-http-header-size: 1638400
